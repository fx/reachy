# Regenerating the snapshot
# -------------------------
# `.duvet/snapshot.txt` is committed and `duvet report --ci` fails whenever the
# re-derived report disagrees with it. After editing a spec or any annotation,
# regenerate from the REPOSITORY ROOT with:
#
#     cd "$(git rev-parse --show-toplevel)" && rm -rf .duvet/requirements && duvet report
#
# If `duvet` is not on your PATH, substitute the invocation your install
# provides — `mise exec -- duvet report` when this repo pins cargo:duvet with
# mise and the shell is not activated, or `~/.cargo/bin/duvet report` after a
# `cargo install duvet --locked`.
#
# The `cd` is not decoration. duvet resolves this config, every specification
# source, and every source pattern relative to the current working directory and
# never searches upwards, so the same command run from a subdirectory loads 0
# specifications, writes no snapshot, and still exits 0 — a silent no-op that
# looks like success.
#
# The `rm -rf` is not optional either. `duvet report` writes one TOML file per
# current spec section into `.duvet/requirements/` and never deletes stale ones,
# so renaming or removing a requirement heading leaves an orphan TOML behind.
# That orphan makes duvet fail locally with `missing section "..."` while CI —
# which runs from a fresh checkout, where `.duvet/requirements/` is gitignored —
# passes. Deleting the directory first keeps local and CI results identical.

'$schema' = "https://awslabs.github.io/duvet/config/v0.4.0.json"

# TWO SPECS ARE STILL UNREGISTERED, AND THAT IS DELIBERATE.
#
# `docs/specs/` holds 8 specs carrying 73 requirements. Six of them are
# registered below:
#
#   - perception, whose 8 requirements are implemented and annotated by
#     docs/changes/0005-perception-capability.md;
#   - groundstation, whose 10 are implemented across changes 0004, 0005 and
#     0006 and registered by the last of them — the one that made REQ-023 and
#     REQ-031 true by building and publishing the image;
#   - robot-link, whose 12 requirements — REQ-010 to REQ-021 — are implemented
#     across changes 0003, 0004, 0007 and 0012. It is registered by 0012,
#     which is the change that closes the set: the robot is the last of the
#     contract's three consumers to exist, so until it did, registering the
#     spec would have claimed traceability for a side of the link nothing
#     implemented;
#   - reachyctl, whose 9 are implemented across changes 0007, 0008 and 0009 and
#     registered by the last of them, which completed the tool's
#     operator-facing surface;
#   - ha-satellite, whose 11 are implemented across changes 0011, 0012 and 0013
#     and registered by the last of them, which added the behaviour layer, the
#     configuration, the settings interface and the packaging to the ports and
#     adapters the first two built;
#   - provisioning, whose 7 — REQ-060 to REQ-066 — are implemented by change
#     0010 and registered by it. There was no partial implementation to
#     register earlier: the roles, the removal path and the idempotency gate
#     arrive together, and REQ-061 is satisfied by the workflow job that runs
#     the gate.
#
# For those six specs, and only those six, `duvet query -c implementation`
# and `duvet report --ci` mean what they appear to mean.
#
# The other 2 are unregistered because not all of their requirements have an
# implementation to annotate yet. Architecture already carries some annotations
# — they show up in the snapshot, because duvet loads a specification an
# annotation points at whether or not it is registered — but registering it
# turns the job red immediately on the requirements no change has reached, and
# it stays red until the implementing change lands. A spec is registered by the
# change that completes it, in that change's pull request, alongside the
# annotations that make it pass. Nothing outside those six is evidence of
# anything today.
#
# Each entry takes a `source` path plus a MANDATORY `format = "markdown"`:
#
#     [[specification]]
#     source = "docs/specs/architecture/index.md"
#     format = "markdown"
#
# Without `format = "markdown"` duvet applies its default IETF parser, extracts
# zero requirements, and exits 0 — a failure that looks exactly like success,
# and one indistinguishable from the vacuous pass a spec-less config gives.

# --- Perception: implemented and annotated by change 0005 -------------------
[[specification]]
source = "docs/specs/perception/index.md"
format = "markdown"

# --- Groundstation: implemented across 0004, 0005 and 0006 ------------------
# Registered by 0006, which is the change that made the last two of its ten
# requirements true — REQ-023, models present in the deployed artifact, and
# REQ-031, both architectures published under one tag. The other eight were
# annotated as 0004 and 0005 implemented them; registering the spec is what
# turns those annotations from documentation into a gate.
[[specification]]
source = "docs/specs/groundstation/index.md"
format = "markdown"

# --- Robot link: implemented across 0003, 0004, 0007 and 0012 ----------------
[[specification]]
source = "docs/specs/robot-link/index.md"
format = "markdown"

# --- reachyctl: implemented across 0007, 0008 and 0009 ----------------------
# Registered by 0009, which is the change that completed the tool's
# operator-facing surface and made the last three of its nine requirements true
# — REQ-051, deployment verifying its own result; REQ-052, preview on every
# command that modifies robot state; and REQ-053, values validated before the
# robot is contacted. The other six were annotated as 0007 and 0008 implemented
# them; registering the spec is what turns those annotations from documentation
# into a gate.
[[specification]]
source = "docs/specs/reachyctl/index.md"
format = "markdown"

# --- HA satellite: implemented across 0011, 0012 and 0013 --------------------
# Registered by 0013, which is the change that completes it. REQ-042, REQ-043,
# REQ-047, REQ-048 and REQ-050 were annotated as 0011 and 0012 built the ports
# and the adapters; 0013 adds the behaviour layer, the configuration, the
# settings interface and the packaging, which is what makes REQ-040, REQ-041,
# REQ-044, REQ-045, REQ-046 and REQ-049 true. Registering the spec is what turns
# all eleven annotations from documentation into a gate.
[[specification]]
source = "docs/specs/ha-satellite/index.md"
format = "markdown"

# --- Provisioning: implemented by change 0010 -------------------------------
# Registered by 0010, which is the change that implements the whole spec at
# once: there was no partial implementation to register earlier, because the
# roles, the removal path and the idempotency gate arrive together. Six of its
# seven requirements are cited from the playbook and the roles; REQ-061 is cited
# from `.github/workflows/provisioning.yml` under the `implication` block below,
# because the job that applies the playbook twice and fails on any change in the
# second application both enforces and verifies it, and there is no other
# artifact to point at.
[[specification]]
source = "docs/specs/provisioning/index.md"
format = "markdown"

# Files that may carry annotations. At least one block is MANDATORY: duvet parses
# annotations only from matched files, so a config without one reports every
# requirement as "Not implemented" and can never pass `duvet query -c
# implementation`. One block per distinct comment syntax — `comment-style` is
# per-block, so add a block per language, not a pattern per language.
#
# ⚠️ The prefixes are `#:=` and `#:%`, not duvet's documented `#=` and `#%`, and
# the colon is load-bearing. `ruff format` normalises a comment to have a space
# after the `#` — `#= …` becomes `# = …`, which duvet no longer recognises — and
# it makes exactly three exceptions, for comments whose body starts with `!`,
# `:` or `#`. So a Python annotation written the documented way is silently
# broken by the formatter, and `just lint` and `just duvet` cannot both pass.
# The Ansible and workflow blocks use the same prefixes. YAML has no formatter
# here to appease, so they could have kept the documented spelling — but one
# syntax across the repository is worth more than that, and an annotation copied
# from a workflow into a module would otherwise arrive silently broken.

# --- Python: every uv workspace member -------------------------------------
[[source]]
pattern = "packages/**/*.py"
comment-style = { meta = "#:=", content = "#:%" }

[[source]]
pattern = "services/**/*.py"
comment-style = { meta = "#:=", content = "#:%" }

[[source]]
pattern = "apps/**/*.py"
comment-style = { meta = "#:=", content = "#:%" }

[[source]]
pattern = "cli/**/*.py"
comment-style = { meta = "#:=", content = "#:%" }

[[source]]
pattern = "bench/**/*.py"
comment-style = { meta = "#:=", content = "#:%" }

[[source]]
pattern = "tools/**/*.py"
comment-style = { meta = "#:=", content = "#:%" }

# --- Ansible: the provisioning roles ----------------------------------------
[[source]]
pattern = "provisioning/ansible/**/*.yml"
comment-style = { meta = "#:=", content = "#:%" }

# --- CI workflows: satisfied-by-construction gates --------------------------
# type = "implication" because every citation under this pattern is a CI job
# that both enforces and verifies the requirement it cites — the leak scan, the
# Ansible idempotency gate, the performance regression gate. There is no other
# artifact to point at: the workflow IS the implementation.
[[source]]
pattern = ".github/workflows/*.yml"
comment-style = { meta = "#:=", content = "#:%" }
type = "implication"

[report.snapshot]
enabled = true
path = ".duvet/snapshot.txt"

[report.json]
enabled = true
path = ".duvet/reports/report.json"
