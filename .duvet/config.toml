# --- Gaze control: implemented across change 0019's three reviewed tasks -----
# Registered by 0019's final implementation task, which adds the unified safety
# state, bounded private diagnostics, named REQ-074–092 acceptance matrix and
# rollback-ready rollout contract after the first two tasks established the
# estimator, deterministic plant and coordinated runtime. The staged rollout is
