# Regenerating the snapshot
# -------------------------
# `.duvet/snapshot.txt` is committed and `duvet report --ci` fails whenever the
# re-derived report disagrees with it. After editing a spec or any annotation,
# regenerate from the REPOSITORY ROOT with:
#
#     cd "$(git rev-parse --show-toplevel)" && rm -rf .duvet/requirements && duvet report
#
# If `duvet` is not on your PATH, substitute the invocation your install
# provides — `mise exec -- duvet report` when this repo pins cargo:duvet with
# mise and the shell is not activated, or `~/.cargo/bin/duvet report` after a
# `cargo install duvet --locked`.
#
# The `cd` is not decoration. duvet resolves this config, every specification
# source, and every source pattern relative to the current working directory and
# never searches upwards, so the same command run from a subdirectory loads 0
# specifications, writes no snapshot, and still exits 0 — a silent no-op that
# looks like success.
#
# The `rm -rf` is not optional either. `duvet report` writes one TOML file per
# current spec section into `.duvet/requirements/` and never deletes stale ones,
# so renaming or removing a requirement heading leaves an orphan TOML behind.
# That orphan makes duvet fail locally with `missing section "..."` while CI —
# which runs from a fresh checkout, where `.duvet/requirements/` is gitignored —
# passes. Deleting the directory first keeps local and CI results identical.

'$schema' = "https://awslabs.github.io/duvet/config/v0.4.0.json"

# EVERY IMPLEMENTED SPEC IS REGISTERED. THIS IS THE STATE THIS COMMENT HAS BEEN
# DESCRIBING AS THE GOAL SINCE BEFORE ANY CODE EXISTED.
#
# `docs/specs/` holds 10 specs. Nine implemented specs carry 92 requirements and
# all nine are registered below, so `duvet query -c implementation` and `duvet
# report --ci` cover every implemented requirement. The proposed Home Assistant
# configuration and camera-feed spec carries REQ-093–098 and is deliberately
# unregistered until change 0020 completes their implementation and annotations.
# Its omission here is what keeps this proposal from making the gate red before
# implementation exists.
#
# The nine implemented and registered specs are:
#
#   - perception, whose 8 requirements are implemented and annotated by
#     docs/changes/0005-perception-capability.md;
#   - groundstation, whose 10 are implemented across changes 0004, 0005 and
#     0006 and registered by the last of them — the one that made REQ-023 and
#     REQ-031 true by building and publishing the image;
#   - robot-link, whose 12 requirements — REQ-010 to REQ-021 — are implemented
#     across changes 0003, 0004, 0007 and 0012. It is registered by 0012,
#     which is the change that closes the set: the robot is the last of the
#     contract's three consumers to exist, so until it did, registering the
#     spec would have claimed traceability for a side of the link nothing
#     implemented;
#   - reachyctl, whose 9 are implemented across changes 0007, 0008 and 0009 and
#     registered by the last of them, which completed the tool's
#     operator-facing surface;
#   - ha-satellite, whose 11 are implemented across changes 0011, 0012 and 0013
#     and registered by the last of them, which added the behaviour layer, the
#     configuration, the settings interface and the packaging to the ports and
#     adapters the first two built;
#   - provisioning, whose 7 — REQ-060 to REQ-066 — are implemented by change
#     0010 and registered by it. There was no partial implementation to
#     register earlier: the roles, the removal path and the idempotency gate
#     arrive together, and REQ-061 is satisfied by the workflow job that runs
#     the gate;
#   - benchmarks, whose 7 — REQ-067 to REQ-073 — are implemented in full by
#     0014, which is the only change that touches them. There is no partial
#     state to wait out either: the suite, the committed baseline and the gate
#     arrive together, because a gate without a baseline gates nothing and a
#     baseline without a suite is prose;
#   - architecture, whose 9 — REQ-001 to REQ-009 — are implemented across
#     changes 0001, 0002, 0003, 0004, 0011 and 0013, and registered by 0015,
#     which is the last change in the plan. It was held back until then for the
#     reason every other entry above gives: registering a spec before its last
#     requirement has an implementation to annotate turns the job red until the
#     implementing change lands, so the rule is that a spec is registered by the
#     change that completes it, in that change's pull request, alongside the
#     annotations that make it pass. Architecture is completed by the change
#     that finishes the plan, so that is where it is registered;
#   - gaze-control, whose 19 — REQ-074 to REQ-092 — are implemented across
#     change 0019's observation foundation, coordinated runtime integration and
#     final safety evidence. It is registered by 0019's final implementation,
#     which completes the deterministic acceptance matrix, bounded diagnostics,
#     recovery validation and rollout contract without claiming live canary
#     outcome evidence that does not yet exist.
#
# The rule that governed the order also governs anything added later: a new spec
# is registered by the change that completes it, not by the change that writes
# it. A registered spec whose requirements nothing implements is a red job that
# stays red, and one that is going to stay red is one somebody switches off.
#
# Each entry takes a `source` path plus a MANDATORY `format = "markdown"`:
#
#     [[specification]]
#     source = "docs/specs/architecture/index.md"
#     format = "markdown"
#
# Without `format = "markdown"` duvet applies its default IETF parser, extracts
# zero requirements, and exits 0 — a failure that looks exactly like success,
# and one indistinguishable from the vacuous pass a spec-less config gives.

# --- Perception: implemented and annotated by change 0005 -------------------
[[specification]]
source = "docs/specs/perception/index.md"
format = "markdown"

