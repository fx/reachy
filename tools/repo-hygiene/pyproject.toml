[project]
name = "reachy-hygiene"
version = "0.2.0"
description = "Repository hygiene gates: the generic environment-leak scanner"
requires-python = ">=3.12"
dependencies = []
# `Private :: Do Not Upload` is rejected by every index that implements the
# trove classifier list, so an accidental publish of this member fails at the
# upload rather than silently succeeding. It is a workspace member because it
# needs the shared resolution, the shared lint and type rules, and the shared
# test run; it is not an artifact this repository distributes.
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reachy_hygiene"]
