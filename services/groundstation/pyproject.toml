[project]
name = "reachy-groundstation"
version = "0.1.0"
description = "Off-robot service hosting heavy computation as pluggable capabilities"
requires-python = ">=3.12"
dependencies = [
    # The wire vocabulary. Declared once, in the contracts package, and imported
    # here rather than restated — see the root AGENTS.md.
    "reachy-contracts",
    # The decoded frame is a numpy array shared by every capability, and the
    # JPEG decoder that produces it is OpenCV's. Both do their work in C or C++,
    # which is the reason the architecture spec keeps this service in Python.
    "numpy>=2.1",
    "opencv-python-headless>=4.10",
    # The model runtime every capability's inference goes through. Named here
    # rather than left to a capability's own extra, because the thread bounds
    # groundstation REQ-027 requires are set on its session options and the
    # service has to be able to set them whatever capability is loaded. The
    # provider list is configuration: this package pulls the CPU build, and the
    # accelerated image variant supplies its own.
    "onnxruntime>=1.19",
    # The metrics registry and the OpenMetrics exposition the /metrics endpoint
    # serves, including the exemplars that carry a frame's identity without
    # making the session or the sequence number a label.
    "prometheus-client>=0.21",
    # Validated configuration. `pydantic_settings` is deliberately outside the
    # TID253 ban: a settings model is configuration, not a wire type.
    "pydantic-settings>=2.5",
    # The ASGI application, its WebSocket endpoint and the server that runs it.
    # `websockets` is uvicorn's WebSocket implementation, named explicitly so the
    # lockfile pins it rather than leaving the choice to an extra.
    "starlette>=0.41",
    "uvicorn>=0.32",
    "websockets>=13.1",
    # Structured logging: every line carries the session identifier and the
    # sequence number of the frame it concerns.
    "structlog>=24.4",
    # Tracing spans across the pipeline stages. The SDK is a runtime dependency
    # rather than a development one because the service installs the provider
    # itself at boot; what it exports is deployment configuration.
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
]

# The accelerated image variant, and nothing else installs this.
#
# The CUDA variant is meant to differ from the default only in its base image and
# its provider preference, and it very nearly does — but the stock `onnxruntime`
# wheel carries no CUDA execution provider at all, so a variant that changed only
# the provider list would have `resolve_providers` drop `CUDAExecutionProvider`
# as unavailable and fall back to the CPU provider without saying anything. This
# extra is what makes the accelerated variant accelerated.
#
# It is an extra rather than a second dependency because both distributions
# install the module `onnxruntime` and each would overwrite the other's files.
# The image build asks for this extra and leaves the CPU wheel out of that one
# build; see `--no-install-package` in the Dockerfile.
#
# Upper-bounded at the major version for the same reason the parity reference is:
# a new major is where the provider names and the CUDA version it links against
# could change, and that is a deliberate edit rather than something a resolver
# does quietly.
[project.optional-dependencies]
cuda = ["onnxruntime-gpu>=1.19,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reachy_groundstation"]

# By path, never by version range: there is no published reachy-contracts a
# resolver could pick instead of the one in this tree.
[tool.uv.sources]
reachy-contracts = { workspace = true }
