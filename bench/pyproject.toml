[project]
name = "reachy-bench"
version = "0.1.0"
description = "Performance suite for the Reachy Mini stack"
requires-python = ">=3.12"
dependencies = ["reachy-contracts"]
# `Private :: Do Not Upload` is rejected by every index that implements the
# trove classifier list, so an accidental publish of this member fails at the
# upload rather than silently succeeding. It is a workspace member because it
# needs the shared resolution and imports the other members; it is not an
# artifact this repository distributes.
classifiers = ["Private :: Do Not Upload"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reachy_bench"]

# By path, never by version range: there is no published reachy-contracts a
# resolver could pick instead of the one in this tree.
[tool.uv.sources]
reachy-contracts = { workspace = true }
