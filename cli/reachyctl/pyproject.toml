[project]
name = "reachyctl"
version = "0.1.0"
description = "Command-line tool for deploying, configuring and diagnosing a Reachy Mini"
requires-python = ">=3.12"
dependencies = ["reachy-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reachyctl"]

# By path, never by version range: there is no published reachy-contracts a
# resolver could pick instead of the one in this tree.
[tool.uv.sources]
reachy-contracts = { workspace = true }
