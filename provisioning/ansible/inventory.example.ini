# The shape of an inventory, and nothing that belongs to anybody's environment.
#
# Copy this to `inventory.ini` — which version control ignores — and fill in the
# real address and account. This repository is public, so the address below is
# from RFC 5737's TEST-NET-1 reserved range and the account name is a
# placeholder; see the root `AGENTS.md`.
#
# A credential never appears here. The groundstation credential reaches the robot
# through Ansible's own secret handling: `--extra-vars @secrets.yml` over an
# `ansible-vault` file, or `--extra-vars reachy_groundstation_credential=...`
# read from a prompt. A variables file carrying one is a file somebody commits.

[reachy]
robot ansible_host=192.0.2.10

[reachy:vars]
ansible_user=reachy
ansible_port=22
# Privileged steps — writing under /etc, installing into the daemon's
# environment, restarting the unit — run through a non-interactive sudo. Turn
# this off for an account that already is root.
ansible_become=true
ansible_become_method=sudo
