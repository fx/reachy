# The playbook's own configuration, so that running it means `ansible-playbook
# site.yml` from this directory and nothing else. Ansible reads the file in the
# current working directory, which is why the Justfile recipes change into this
# one rather than passing a path.

[defaults]
# The real inventory, which is untracked. `inventory.example.ini` is the tracked
# shape of it — architecture REQ-003: no environment-specific value in version
# control. Copy it, fill it in, and it is ignored by git.
inventory = inventory.ini
roles_path = ./roles

# Where the roles reach their Python. These are the second implementation of the
# managed drop-in's format and the caller of the shared check registry; both are
# ordinary modules, checked and tested with the rest of the repository.
filter_plugins = ./plugins/filter

# Host keys are verified. There is deliberately no setting here that turns that
# off, for the same reason `reachyctl` offers no such option.
host_key_checking = True

# The robot's own interpreter, discovered rather than assumed. `auto_silent`
# suppresses the deprecation warning about the discovery itself, which is noise
# on every task rather than information about the robot.
interpreter_python = auto_silent

# A run against a robot on a WLAN measured at 100-170 ms idle spends most of its
# time waiting, so the progress an operator reads should say which task is
# running rather than appear all at once at the end.
stdout_callback = default
display_skipped_hosts = True

[ssh_connection]
# One SSH round trip per task instead of three. It requires `requiretty` to be
# off in the target's sudoers, which is the default on the Debian-derived image
# the robot runs.
pipelining = True
