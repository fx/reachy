[project]
name = "reachy-mini-ha-satellite"
version = "0.1.0"
description = "Robot-side ESPHome voice satellite for Home Assistant"
requires-python = ">=3.12"
# The ESPHome protocol layer in `src/reachy_mini_ha_satellite/esphome/` is
# vendored, but its own dependencies are not: they are ordinary packages, and
# these are the ones the carried modules import.
#
# Every upper bound is the next release that may change something this code
# depends on, which is not always the next major:
#
#   - For the four post-1.0 packages it is the major, because each is a protocol
#     library or a model runtime where a major release can change a wire format
#     or a file format.
#   - `netifaces2` is 0.0.x, where the patch is what moves, so its ceiling is the
#     next minor. `zeroconf` is 0.x but releases minors freely, so its ceiling is
#     1.0.
#   - `websockets` is bounded by the API the vendored code calls, not by a
#     major. `peripheral_api.py` uses `websockets.server.serve`, which is the
#     current API through 13 and deprecated from 14 onward. The ceiling also
#     stays inside the Reachy Mini SDK's own `>=12,<16`, so the two resolve
#     together in the robot's shared application environment rather than
#     conflicting the moment this wheel is installed beside it.
#
# Deliberately absent: `soundcard` and `python-mpv`, which upstream used for
# desktop capture and playback. On this robot the daemon owns both devices, so
# neither library is carried and each became a seam instead — see
# `esphome/seams.py`. The Reachy Mini SDK is absent from this list too, and that
# is the point of the `local-detection` extra below.
dependencies = [
    "reachy-contracts",
    # The one client implementation of the robot link session protocol. The
    # groundstation perception adapter is its second consumer, after
    # `reachyctl probe`; reachyctl REQ-057 is why there is not a second
    # implementation of it here.
    "reachy-session-client",
    # The daemon hands over camera frames and recorded audio as numpy arrays,
    # and the head is commanded with a four-by-four matrix. The adapters convert
    # between those and what the ports carry; nothing else in this package uses
    # it.
    "numpy>=2.1,<3",
    # The ESPHome native API: protobuf message types, the frame helper and the
    # entity model Home Assistant speaks.
    "aioesphomeapi>=45.3,<46",
    # Default network interface and address lookup (`esphome/util.py`).
    "netifaces2>=0.0.22,<0.1",
    # Wake-word runtimes. Detection runs on the robot, per ha-satellite REQ-044.
    "pymicro-wakeword>=2,<3",
    "pyopen-wakeword>=1,<2",
    # mDNS advertisement, which is how Home Assistant discovers the satellite.
    "zeroconf>=0.130,<1",
    # Microphone gain control and noise suppression (`esphome/webrtc.py`).
    "webrtc-noise-gain>=1,<2",
    # The peripheral WebSocket API (`esphome/peripheral_api.py`). Upstream
    # imports it lazily and degrades to a log line when it is missing; it is
    # declared here so the feature is actually present rather than accidentally
    # disabled.
    "websockets>=12,<14",
    # Validated configuration. `pydantic_settings` is deliberately outside the
    # TID253 ban: a settings model is configuration, not a wire type.
    "pydantic-settings>=2.5",
    # The settings interface ha-satellite REQ-049 requires, and the server that
    # runs it. The same pair the groundstation uses, deliberately: a second web
    # framework in this repository would be a second set of conventions for
    # rendering a redacted configuration, and this one is already on the robot —
    # the daemon's own dashboard is built on it.
    "starlette>=0.41",
    "uvicorn>=0.32",
]

# How the Reachy Mini daemon finds this application. ha-satellite REQ-041: the
# wheel being installed is the whole of registering it, and the daemon
# enumerates this entry-point group at startup.
#
# ⚠️ The value points at `daemon_app`, which is the ONLY module in this package
# that imports the Reachy Mini SDK — see its docstring. The entry point has to
# resolve to a subclass of the SDK's application base class, and that class
# cannot be reached without importing the SDK, so the import is confined to the
# one file the daemon loads rather than admitted into the package's import graph.
[project.entry-points.reachy_mini_apps]
reachy-mini-ha-satellite = "reachy_mini_ha_satellite.daemon_app:ReachyMiniHaSatellite"

# Running face detection on the robot itself, which ha-satellite REQ-047 makes
# one of the three selectable sources. An extra rather than a dependency, and
# that is not a packaging preference:
#
#   - `import reachy_mini.<anything>` executes the distribution's `__init__`,
#     which transitively imports `reachy_mini.vision.face_tracking`, which does
#     `import gi`. A hard dependency would therefore put PyGObject and the whole
#     GStreamer stack between this package's test suite and running at all,
#     which architecture REQ-005 forbids.
#   - On the robot it costs nothing: the daemon's shared application environment
#     already provides the SDK, so the extra is satisfied before the wheel is
#     installed.
#
# `adapters/perception_local.py` loads one module of it by file path, inside the
# function that needs it, so even here the package is never executed. The three
# packages beside it are what that module imports.
[project.optional-dependencies]
local-detection = [
    "reachy-mini>=1.9,<2",
    "huggingface-hub>=1.17",
    "onnxruntime>=1.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reachy_mini_ha_satellite"]

# By path, never by version range: there is no published reachy-contracts or
# reachy-session-client a resolver could pick instead of the ones in this tree.
[tool.uv.sources]
reachy-contracts = { workspace = true }
reachy-session-client = { workspace = true }
