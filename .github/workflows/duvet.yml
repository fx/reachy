name: Requirements traceability

on:
  pull_request:
  push:
    branches: [main]

jobs:
  duvet:
    name: Requirements traceability
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit SHA, not by tag. A tag is a mutable ref: retargeting it
      # upstream would run changed third-party code here with no diff in this
      # repository to review. The trailing comment records which release the SHA
      # corresponds to, since the SHA alone is unreadable.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Two independent pins. The action ref is the commit behind v0.4.2, the
      # newest tag awslabs/duvet has — there is no v0.4.3 tag even though crate
      # 0.4.3 exists on crates.io. The action is a thin wrapper that installs the
      # duvet crate at `version:`, so its own ref does not constrain that
      # version. Pin `version:` explicitly: the action's default input is a
      # stale 0.3.0.
      - name: Install duvet
        uses: awslabs/duvet@0c8d07860e0652af7e9d19c5997ebf035ca1a1b8 # v0.4.2
        with:
          version: 0.4.3

      # The coverage gate. `duvet report --ci` only diffs the committed
      # snapshot — duvet skips its own coverage enforcement whenever a snapshot
      # path is configured — so without this step a requirement with no citing
      # annotation would pass CI unnoticed.
      #
      # This step checks the specs registered in .duvet/config.toml, which is
      # now all eight of them — 73 requirements, every one traced. A green run
      # here is therefore evidence about the whole of this repository's
      # requirements rather than about a subset, which it was until change 0015
      # registered the last spec. The header comment in that file records which
      # change registered which spec, and the rule that governs anything added
      # later: a spec is registered by the change that completes it.
      - name: Verify every requirement is implemented
        run: duvet query -c implementation

      # Re-derives the report and diffs it against the committed snapshot,
      # failing if annotations and .duvet/snapshot.txt disagree.
      - name: Verify requirement coverage snapshot
        run: duvet report --ci
