name: Release

# Version derivation, and the wheels. Two jobs on two different events, and
# neither ever runs on the other's.
#
# release-please maintains a release pull request on the default branch,
# accumulating conventional commits and the version they imply. Merging that
# pull request is the release: the action then creates the tag and the GitHub
# release. Nothing happens on a merge that is not the release pull request
# except the release pull request being updated.
#
# The tag it creates is what runs the second job, which builds the `reachyctl`
# wheel and the three unpublished wheels it needs, installs the set into an
# empty environment to prove the release is installable, records each wheel's
# size for change 0014 to gate on, and attaches them all to the release. The
# container image is published from `images.yml` on the same tag.
#
# Every step calls a Justfile recipe rather than restating its command, so what
# runs here reproduces locally with the command in the step.
#
# ⚠️ **Publishing depends on RELEASE_PLEASE_TOKEN existing.** GitHub does not
# start a workflow run for an event raised by the default GITHUB_TOKEN, so a tag
# created with the fallback below raises no `push` event for a tag and neither
# `publish-wheels` here nor `Publish` in `images.yml` ever runs — the release is
# created and carries no artifacts. That is why `workflow_dispatch` is a trigger:
# publishing for a tag is recoverable by hand, and `Verify the tag` below refuses
# a tag whose version disagrees with the tree, so running it by hand cannot
# publish the wrong thing. The fallback is kept because version derivation has to
# keep working before the secret exists; see the completion notes in
# docs/changes/0002-ci-and-hygiene-gates.md.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          A version tag to publish the wheels for, such as v1.2.3. Use this when
          the tag was created with the fallback token, which raises no event.
        required: true
        type: string

permissions:
  contents: read

# Keyed on what the run OPERATES ON, not on the ref it was dispatched from.
# `github.ref` is `refs/heads/main` for every `workflow_dispatch` run whatever
# tag it was given, so grouping on it would put two manual publishes of
# different tags — and release-please's own run on `main` — in one group, where
# they would serialise behind each other for no reason. `inputs.tag` is unset
# for a push, so a push falls back to its ref: `refs/heads/main` for the
# derivation run, `refs/tags/vX.Y.Z` for the publish it creates.
#
# `cancel-in-progress` stays false. A publish that is halfway through attaching
# wheels to a release is not something to cancel.
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  #:= docs/specs/architecture/index.md#req-002-one-version-for-the-whole-repository
  #:% Every artifact published from this repository MUST carry the same version
  #:% string, derived from a single repository-wide version.
  release-please:
    name: Release please
    runs-on: ubuntu-latest
    # The default branch only. This workflow now also runs on the tag
    # release-please itself creates, and running the action again there would be
    # asking it to derive a version for a commit it has just released.
    if: github.ref == 'refs/heads/main'
    permissions:
      # Writing the release pull request, the tag and the release, plus the
      # labels release-please puts on its own pull request to track its state.
      # Narrowed to this job rather than granted to the workflow, so the
      # workflow-level default stays read-only.
      contents: write
      pull-requests: write
      issues: write
    steps:
      # The version it derives is written to every place that declares one —
      # see release-please-config.json, where the list is spelled out. One
      # derivation, applied to every artifact, is what makes "which app goes
      # with which groundstation" answerable from the tag alone.
      #
      # ⚠️ The token matters. GitHub does not start a workflow run for an event
      # raised by the default GITHUB_TOKEN, so a release pull request opened
      # with it shows no Checks or Hygiene results at all — and once those are
      # required, it can never be merged. RELEASE_PLEASE_TOKEN is a repository
      # secret holding a token whose events do trigger workflows; the fallback
      # keeps this job working before that secret exists, at the cost of a
      # release pull request whose checks have to be re-run by hand. See the
      # completion notes in docs/changes/0002-ci-and-hygiene-gates.md.
      - name: Derive the version and maintain the release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  #:= docs/specs/ha-satellite/index.md#req-041-the-application-is-discoverable-by-the-robot-daemon
  #:% The application MUST advertise itself through the daemon's application entry
  #:% point mechanism so that installing the wheel is sufficient for the daemon to
  #:% find it.
  #
  #:= docs/specs/architecture/index.md#req-002-one-version-for-the-whole-repository
  #:% Every artifact published from this repository MUST carry the same version
  #:% string, derived from a single repository-wide version.
  publish-wheels:
    name: Publish the wheels
    runs-on: ubuntu-latest
    # A version tag, or a hand-started run naming one. See the note at the top
    # of this file for why the second exists.
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || github.event_name == 'workflow_dispatch'
    permissions:
      # Attaching the wheels to the release release-please created. Narrowed to
      # this job, so the workflow-level default stays read-only.
      contents: write
    steps:
      # The tag itself for a hand-started run, so the wheels are built from the
      # commit the tag names rather than from whatever the branch has since
      # become.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up the workspace
        uses: ./.github/actions/setup-workspace

      # One version for the whole repository, read from the place release
      # automation writes it rather than from the tag. The tag has to agree: a
      # tag pushed by hand at a commit whose version says something else would
      # otherwise publish a wheel labelled with neither. That check is also what
      # makes the hand-started run safe — it cannot publish the wrong thing,
      # whatever tag it is given.
      - name: Resolve the version the tag carries
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="$(just version)"
          if [ "$TAG" != "v${version}" ]; then
            echo "::error::the tag is ${TAG} but the repository version is ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build the wheels
        run: just wheels

      # A wheel that builds and cannot be installed is a passing build and a
      # broken release. This installs the set into an empty environment with no
      # workspace sources on the path and drives the console script, which is
      # what catches an unpublished sibling that only resolves in this checkout.
      - name: Install the wheels into an empty environment and run the tool
        run: just wheel-verify

      # Recorded as a release output so change 0014 can gate on their growth,
      # in the same JSON shape `just image-size` emits. Three places on purpose:
      # the log, the job summary a human reads, and an artifact a later job or a
      # later change can fetch.
      - name: Record the wheel sizes
        run: |
          set -euo pipefail
          mkdir --parents wheel-size
          {
            echo '### Wheel sizes'
            echo
            echo '```json'
          } >> "$GITHUB_STEP_SUMMARY"
          for wheel in dist/*.whl; do
            name="$(basename "${wheel%.whl}")"
            just wheel-size "$wheel" | tee "wheel-size/${name}.json" \
              >> "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # The size gate, run where the wheels are built. It fails when a wheel has
      # grown beyond the size recorded in `bench/baseline.json`, so a dependency
      # that arrived without anybody weighing it stops the release rather than
      # shipping in it. The image's own size is gated the same way in
      # `images.yml`; sizes are collected from the change that produces each
      # artifact rather than from one build.
      #
      #:= docs/specs/benchmarks/index.md#req-073-artifact-size-is-measured-as-a-tracked-quantity
      #:% The suite MUST record the size of each published artifact and treat growth
      #:% beyond a stated tolerance as a regression.
      - name: Fail if a wheel has grown beyond its recorded size
        run: just bench-sizes --artifact-size wheel-size/

      - name: Publish the sizes as an artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reachyctl-wheel-size
          path: wheel-size/
          if-no-files-found: error

      # A digest published beside the wheels, so an operator installing one can
      # check they have the artifact this workflow built. The satellite wheel in
      # particular goes into the environment the daemon runs applications from,
      # so "which file is this?" is a question worth being able to answer — see
      # the deployment runbook, which has the check as a step.
      - name: Record what the wheels hash to
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum ./*.whl | tee SHA256SUMS

      # Attached to the release release-please created for this tag. The
      # architecture spec names GitHub Releases as the destination for both
      # wheels, and `--clobber` makes a re-run of this job replace what it
      # uploaded rather than fail on it.
      #
      # The release is created in the same action that pushed the tag, so it is
      # normally there before this job starts; the wait covers the case where it
      # is not yet, rather than failing a release over a few seconds.
      - name: Attach the wheels to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              break
            fi
            echo "the release for $TAG is not there yet (attempt ${attempt}); waiting"
            sleep 10
          done
          gh release upload "$TAG" dist/*.whl dist/SHA256SUMS wheel-size/*.json --clobber
