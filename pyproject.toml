[project]
name = "reachy"
version = "0.2.0"
description = "Workspace root for the Reachy Mini monorepo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "reachy-bench",
    "reachy-checks",
    "reachy-contracts",
    "reachy-groundstation",
    "reachy-hygiene",
    "reachy-mini-ha-satellite",
    "reachy-session-client",
    "reachyctl",
]

[dependency-groups]
dev = [
    "diff-cover>=9.2",
    # `httpx.ASGITransport` speaks HTTP to an ASGI application in memory, which
    # is what lets the endpoint tests drive the real routes, the real middleware
    # and the real responses without opening a socket.
    "httpx>=0.27",
    "mypy>=1.11",
    # An in-memory filesystem. The satellite's carried upstream tests exercise
    # code that reads and writes files; this is what lets them do so without
    # performing any input or output, which is the standing rule for unit tests.
    "pyfakefs>=5.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-socket>=0.7",
    # The compose file and the metrics scrape configuration are checked against
    # the service's own settings model by an ordinary test, so that a setting
    # added without updating the deployment is a red run rather than a
    # deployment that disagrees with its own documentation. Reading them means
    # parsing YAML. Declared here rather than leaned on transitively: a test
    # that depends on somebody else's dependency breaks when they drop it.
    "pyyaml>=6.0",
    "ruff>=0.6",
    # Stubs for the generated protobuf modules the vendored ESPHome protocol
    # imports. Upstream declares them too; without them mypy cannot follow
    # `google.protobuf` and reports every import as untyped.
    "types-protobuf>=5",
    # Stubs for the YAML parser the deployment tests read the compose file and
    # the scrape configuration with. Without them strict mode rejects the import.
    "types-pyyaml>=6.0",
]

# The Ansible control machine, pinned here rather than assumed present on
# whoever runs the playbook. Provisioning's roles reach the shared check
# registry and the setting vocabulary as ordinary Python imports — that is
# reachyctl REQ-056, and it is why the playbook runs under this environment's
# interpreter rather than a system Ansible that cannot see the workspace.
#
# A group of its own, and deliberately not in `default-groups` below: a lint, a
# type check and a test run have no use for an Ansible engine, and adding sixty
# megabytes to every one of them to serve two recipes is the wrong trade. `just
# provision-lint` and `just provision-idempotency` ask for it by name, and `uv
# run --group provisioning` installs it from the same lockfile everything else
# resolves against.
provisioning = [
    # The engine. Bounded above at the next minor, because a control-node
    # release is where module and plugin interfaces move, and the roles here
    # call `ansible.builtin.systemd_service` and a filter plugin of their own.
    "ansible-core>=2.19,<2.22",
    # The lint the `provision-lint` recipe runs. It carries its own opinions
    # about role layout and task naming, which is what makes it worth a pin: an
    # unpinned linter is a gate whose verdict changes without a diff here.
    "ansible-lint>=25.0,<27",
]

# The reference implementation the YuNet parity test measures against, and
# nothing else. Perception REQ-036 requires the hand-written decoding be checked
# against an independent reference, and the Reachy Mini SDK's own detector is
# that reference: it runs the identical weights, it is maintained elsewhere, and
# it already runs on the robot.
#
# It is a group of its own rather than another line in `dev` so that the
# `[[tool.uv.dependency-metadata]]` block below has one obvious thing it is
# about. It is never a dependency of `reachy-groundstation`: the service
# implements its own decoding and the SDK exists here only to disagree with it.
parity = [
    # Bounded above at the major version. The metadata block below deliberately
    # applies to every version — pinning it there would let a routine bump
    # reintroduce the whole PyGObject dependency tree it exists to avoid — so
    # the bound belongs here instead: a new major, which is where the module
    # this loads could change what it imports, is a deliberate edit and a
    # review rather than something a resolver does quietly.
    "reachy-mini>=1.9,<2",
    # `reachy_mini.vision.face_detector` imports these three at module level.
    # `huggingface_hub` is imported for its downloader, which the parity test
    # redirects at the already-fetched local file — the service never reaches
    # the network for a model, and neither does its test.
    "huggingface-hub>=1.17",
    "numpy>=2.1",
    "onnxruntime>=1.19",
]

# The root is not itself a distribution: it exists to hold one resolution, one
# set of development tools, and the shared tool configuration below. Depending
# on every member means `uv sync` produces an environment with all of them
# importable, which is what the test, lint and type-check recipes run against.
[tool.uv]
package = false
# Both groups are installed by `uv sync` and by every `uv run` the Justfile
# makes, so the parity reference is present wherever the test suite runs. A
# group that had to be asked for would be a merge gate that is skipped by
# default, which is the one thing perception REQ-036 must not be.
default-groups = ["dev", "parity"]

# `reachy-mini`'s real metadata requires PyGObject, and through it the whole
# GStreamer stack — because the distribution also ships the robot's camera and
# audio pipelines. None of that is needed here: the parity reference is one
# module, `reachy_mini/vision/face_detector.py`, whose only imports are `math`,
# `dataclasses`, `numpy`, `onnxruntime`, `huggingface_hub` and `numpy.typing`.
# Declaring the metadata statically is uv's supported way of saying "install
# this one without its dependency tree", and it is what makes the parity gate
# installable on a runner that has no system GTK. The three requirements listed
# are exactly what that module imports, and they are in the `parity` group above
# so the resolver still pins them.
#
# The version is deliberately absent: uv then applies this metadata to every
# version of the distribution, so a routine bump does not silently reintroduce
# the dependency tree this block exists to avoid.
[[tool.uv.dependency-metadata]]
name = "reachy-mini"
requires-dist = ["numpy", "onnxruntime", "huggingface-hub>=1.17"]

[tool.uv.workspace]
members = [
    "packages/reachy-checks",
    "packages/reachy-contracts",
    "packages/reachy-session-client",
    "apps/ha-satellite",
    "services/groundstation",
    "cli/reachyctl",
    "bench",
    "tools/repo-hygiene",
]

# Members resolve to each other by path, never by version range, so there is no
# published version of one member that a sibling could be resolved against.
[tool.uv.sources]
reachy-bench = { workspace = true }
reachy-checks = { workspace = true }
reachy-contracts = { workspace = true }
reachy-groundstation = { workspace = true }
reachy-hygiene = { workspace = true }
reachy-mini-ha-satellite = { workspace = true }
reachy-session-client = { workspace = true }
reachyctl = { workspace = true }

# --- Shared tool configuration ----------------------------------------------
# Every member inherits the sections below. Members do not carry their own
# ruff, mypy, pytest or coverage configuration: per-member dialects drift, and a
# reviewer reading one file should be able to tell what the rules are.

[tool.ruff]
line-length = 88
target-version = "py312"
src = [
    "packages/reachy-checks/src",
    "packages/reachy-contracts/src",
    "packages/reachy-session-client/src",
    "apps/ha-satellite/src",
    "services/groundstation/src",
    "cli/reachyctl/src",
    "bench/src",
    "tools/repo-hygiene/src",
    # Not a member: the Ansible filter plugins the provisioning roles reach
    # their Python through. They are a directory of loose modules the way
    # `scripts/` is, and they are on the path here for the same reason — so an
    # import of one resolves rather than degrading to `Any`.
    "provisioning/ansible/plugins/filter",
]

[tool.ruff.lint]
select = [
    "A",    # builtin shadowing
    "ANN",  # missing annotations
    "ARG",  # unused arguments
    "B",    # bugbear
    "C4",   # comprehensions
    "D",    # docstrings
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # naming
    "PGH",  # blanket suppressions
    "PT",   # pytest style
    "PTH",  # pathlib over os.path
    "RET",  # return values
    "RUF",  # ruff-specific
    "S",    # bandit
    "SIM",  # simplifications
    "TID",  # tidy imports
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]

[tool.ruff.format]
# Vendored third-party code is left formatted the way its upstream formats it —
# upstream wraps at 200 columns, this repository at 88. Reformatting would
# rewrite every line, which turns the scheduled upstream-drift comparison into
# noise and makes a derived file look authored here. These are the only files in
# the tree the formatter does not own; see the NOTICE beside them.
exclude = [
    "apps/ha-satellite/src/reachy_mini_ha_satellite/esphome/{api_server,entity,models,peripheral_api,satellite,util,wake_word,webrtc,zeroconf}.py",
    "apps/ha-satellite/tests/esphome_test_support.py",
    "apps/ha-satellite/tests/test_satellite_esphome_*.py",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and pytest rewrites those asserts; S101 is the rule that objects
# to `assert` in shipped code, which is not what a test file is.
"**/tests/**/*.py" = ["S101"]
# The wire-type ban further down is lifted here, and only here. This package is
# the declaration site every other member is pointed at, so it is the one place
# a pydantic model is not a second copy of somebody else's contract.
"packages/reachy-contracts/**/*.py" = ["TID253"]

# The `banned-api` list further down bans Reachy-specific imports so that the
# vendored ESPHome directory cannot grow a robot dependency. Those imports are
# ordinary everywhere else, so every file outside that directory ignores the
# rule. The pattern is negated rather than enumerating the allowed paths: a
# directory added later is allowed automatically, and the one place the boundary
# holds stays named in exactly one line.
"!apps/ha-satellite/src/reachy_mini_ha_satellite/esphome/**" = ["TID251"]

# A duvet annotation's target is one unbreakable token — the specification's
# path followed by the requirement's anchor — and REQ-007's heading is long
# enough to carry it past 88 columns. Wrapping it would stop duvet resolving the
# citation, so the line stands and the rule stands down for this file, which
# holds a module docstring and that annotation and nothing else.
"apps/ha-satellite/src/reachy_mini_ha_satellite/esphome/__init__.py" = ["E501"]

# Vendored third-party code. Ruff's job here is not style: it is the
# import-direction boundary (TID251) and the correctness rules, which stay on.
# Everything below is upstream's dialect — its line length, its docstring habits,
# its pre-PEP-585 typing, its `open()` over `Path.open()` — and rewriting any of
# it would fork the file from upstream for no behavioural gain. S104, S110 and
# S310 are inherited findings, not new exposure: an mDNS advertisement binds
# every interface by design, and the external wake-word download is upstream's
# feature reached through a URL Home Assistant supplies. `seams.py` and
# `__init__.py` in the same directory are ours and are NOT listed here.
"apps/ha-satellite/src/reachy_mini_ha_satellite/esphome/{api_server,entity,models,peripheral_api,satellite,util,wake_word,webrtc,zeroconf}.py" = [
    "ANN",    # upstream annotates partially
    "ARG002", # unused method arguments in protocol handlers
    "B010",   # setattr with a constant, used to tag a loaded model
    "C413",   # list(sorted(...)) in a log line
    "D",      # upstream's docstring conventions are not this repository's
    "E501",   # upstream wraps at 200 columns
    "I001",   # upstream's import order is isort-with-black at 200 columns
    "N806",   # upstream names some locals in caps
    "PGH003", # one blanket `# type: ignore` upstream carries
    "PTH123", # upstream uses `open()` rather than `Path.open()`
    "RET504", # unnecessary assignment before return
    "RUF001", # ambiguous unicode in strings
    "RUF002", # ambiguous unicode in docstrings
    "RUF003", # ambiguous unicode in comments
    "RUF022", # `__all__` is not sorted
    "RUF046", # redundant int() casts
    "RUF100", # a `# noqa` for a rule this repository does not select
    "S101",   # upstream narrows an Optional with an assert
    "S104",   # binds every interface: that is what an mDNS advertisement does
    "S110",   # try/except/pass around a best-effort log push
    "S310",   # urlopen of a URL Home Assistant supplies, upstream's feature
    "SIM102", # collapsible ifs
    "SIM105", # contextlib.suppress would read better
    "UP",     # upstream still supports 3.11 and types accordingly
]

# The tests carried from the same upstream, for the same reasons.
"apps/ha-satellite/tests/{esphome_test_support,test_satellite_esphome_*}.py" = [
    "ANN",    # upstream's tests are unannotated
    "ARG002",
    "C408",
    "D",
    "E501",
    "I001",
    "N805",
    "PTH123",
    "RUF012",
    "RUF059", # unused values unpacked from a tuple return
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# The formatter still wraps code at `line-length` above; this only relaxes the
# rule that flags a line the formatter cannot split. A duvet annotation's meta
# line is a spec path plus a section anchor derived from the requirement's
# heading, which is one unbreakable token — and the specs are frozen, so the
# heading cannot be shortened to fit. The alternative is a `# noqa` on the
# annotation itself, which duvet would then read as part of the anchor.
[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

# The import direction, enforced rather than documented. A wire type is declared
# once, in `reachy-contracts`, and every other member imports it from
# `reachy_contracts`; a member that reaches for pydantic is about to declare a
# second copy of a shape that already exists, and the two are then free to drift
# until a robot behaves oddly. The exemption for the declaration site itself is
# the TID253 entry in `per-file-ignores` above.
#
# TID253 rather than `banned-api`, for two reasons. TID251 is already spoken for
# by the vendored ESPHome boundary below, whose negated `per-file-ignores` entry
# switches the whole rule off outside that directory — so a `banned-api` entry
# added here would be silently dead everywhere it needed to fire. And naming the
# module covers every way to declare a model at once, including
# `pydantic.dataclasses`, the `pydantic.v1` shim and whatever pydantic adds next,
# where `banned-api` had to enumerate eleven qualified paths and would miss the
# twelfth.
#
# It is deliberately coarser than "no model bases": any module-level pydantic
# import outside the contracts package trips it. `pydantic_settings` is not
# banned, so validated configuration is unaffected — but a settings model that
# also wants pydantic's own `Field` suppresses this on that import, with a
# comment saying the model is configuration and not a wire type.
banned-module-level-imports = ["pydantic"]

# The import-direction boundary, enforced rather than left to convention.
#
# Nothing under the vendored ESPHome directory may import anything
# Reachy-specific: not this package's own robot-side modules, not the Reachy Mini
# SDK, not the shared contracts. The dependency runs one way — the robot side
# depends on the vendored protocol — so upstream code never grows a robot
# dependency, and a future upstream comparison stays meaningful.
#
# `banned-api` is global, so the scoping lives in the negated per-file-ignores
# entry above: every file outside the vendored directory ignores TID251, and the
# vendored directory does not. Relative imports inside the directory are
# unaffected, which is how the vendored modules reach each other and their seams.
#
# The list names modules, not the package root, and deliberately so: ruff resolves
# a relative import to its absolute path before matching, so banning
# `reachy_mini_ha_satellite` outright would ban `from .entity import ...` inside
# the vendored directory as well. `just lint-boundary` closes that gap with a
# second check the same recipe proves fires — no absolute `reachy`-prefixed import
# in the directory at all, whatever form it takes.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"reachy_mini".msg = "The vendored ESPHome code must not import the Reachy Mini SDK; reach hardware through a seam in esphome/seams.py, implemented by an adapter outside this directory."
"reachy_contracts".msg = "The vendored ESPHome code must not import the shared contracts; the dependency runs from the robot side towards the vendored protocol, never the reverse."
"reachy_mini_ha_satellite.adapters".msg = "The vendored ESPHome code must not import a Reachy adapter; that is the import direction the seams exist to invert."
"reachy_mini_ha_satellite.assets".msg = "The vendored ESPHome code must not import the asset registry; asset paths are wired in from outside the directory."
"reachy_mini_ha_satellite.main".msg = "The vendored ESPHome code must not import the application entry point."
"reachy_mini_ha_satellite.behaviour".msg = "The vendored ESPHome code must not import the behaviour layer."
"reachy_mini_ha_satellite.config".msg = "The vendored ESPHome code must not import this application's configuration."
"reachy_mini_ha_satellite.ports".msg = "The vendored ESPHome code must not import this application's ports."
"reachy_mini_ha_satellite.wake_word".msg = "The vendored ESPHome code must not import the wake-word detector; it runs the models this code merely loads and announces, and it is driven from outside the directory."
"reachy_mini_ha_satellite.web".msg = "The vendored ESPHome code must not import this application's web interface."

[tool.mypy]
python_version = "3.12"
# Without the plugin a pydantic model's `__init__` is `(**data: Any)`, so strict
# mode checks every call in the repository except the ones that build a message
# — which is the class of mistake the wire types exist to catch.
plugins = ["pydantic.mypy"]
# Strict for every module. Relaxations are per-module `[[tool.mypy.overrides]]`
# blocks carrying a comment that names the reason, never a global loosening.
strict = true
warn_unreachable = true
explicit_package_bases = true
mypy_path = [
    "packages/reachy-checks/src",
    "packages/reachy-contracts/src",
    "packages/reachy-session-client/src",
    "apps/ha-satellite/src",
    "services/groundstation/src",
    "cli/reachyctl/src",
    "bench/src",
    "tools/repo-hygiene/src",
    # Not a member: `scripts/` holds the helpers the Justfile calls. It is on the
    # path so their tests can import them by name, the same way `scripts/tests/`
    # puts it on `sys.path` at run time.
    "scripts",
    # Not a member either. A member's `tests/` is deliberately not a package, so
    # a test module reaches its siblings' shared fakes by plain module name; the
    # member's `conftest.py` puts this directory on `sys.path` at run time and
    # this entry is the same thing for the type checker. Without it the helper is
    # still checked — it is under `files` — but every import of it is unresolved
    # and the fakes it exports degrade to `Any`, which strict mode then rejects.
    #
    # It is the `support/` subdirectory rather than `tests/` itself because a
    # mypy path root makes the files directly under it top-level modules, and two
    # members' `conftest.py` would then both be the module `conftest`.
    "services/groundstation/tests/support",
    "packages/reachy-checks/tests/support",
    "packages/reachy-session-client/tests/support",
    "cli/reachyctl/tests/support",
    "apps/ha-satellite/tests/support",
    "bench/tests/support",
    # Not a member either, and the same arrangement as `scripts/` above: the
    # Ansible filter plugins are loose modules loaded by name, so this is what
    # makes `import reachy_managed` in their tests resolve to the file Ansible
    # loads rather than to nothing.
    "provisioning/ansible/plugins/filter",
]
files = [
    "packages",
    "apps",
    "services",
    "cli",
    "bench",
    "tools",
    "scripts",
    "provisioning",
]
# The idempotency gate's container fixture. It declares a package named
# `reachy_mini` — a stand-in for the vendor daemon, installed nowhere but inside
# that container — and this repository also depends on the real `reachy-mini`
# distribution for the perception parity reference. Leaving the fixture on the
# type checker's path would let it shadow the real SDK for every module that
# imports it, so it is excluded rather than renamed: the name is the point, since
# the roles reach it as `reachy_mini.apps`. Ruff still lints it — ruff resolves no
# imports, so nothing there can shadow anything.
exclude = ["^provisioning/ci/"]
# `ignore-without-code` is how the "a suppression carries its rule identifier"
# rule is enforced for mypy; ruff's PGH003/PGH004 enforce the same for lint.
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# --- The model runtime ------------------------------------------------------
# `onnxruntime` ships no `py.typed` marker and no stubs, so mypy cannot follow
# it and strict mode reports every import of it. This is the narrowest available
# relaxation: it applies to that distribution alone, and the modules that use it
# stay strict — `reachy_groundstation.runtime.onnx` annotates every signature it
# exposes, so what the rest of the service sees is typed even though what it
# wraps is not. Nothing else in the tree imports it.
[[tool.mypy.overrides]]
module = ["onnxruntime.*"]
ignore_missing_imports = true

# --- The Reachy Mini SDK ----------------------------------------------------
# The distribution ships no `py.typed` marker, so mypy cannot follow it. Exactly
# one module in this repository imports it — `reachy_mini_ha_satellite.daemon_app`,
# which subclasses the daemon's application base class because that is what the
# `reachy_mini_apps` entry point has to resolve to — and the relaxation is
# therefore as narrow as it can be: the distribution alone, and the one module
# that names it. Everything else reaches the SDK through the protocols in
# `adapters/daemon.py`, which are this repository's own and stay strict.
[[tool.mypy.overrides]]
module = ["reachy_mini.*"]
ignore_missing_imports = true

# The base class above is `Any` to mypy for the same reason, so subclassing it
# trips `disallow_subclassing_any`. Relaxed for this module alone; the two
# methods it defines are annotated and are checked, and the alternative is
# writing stubs for somebody else's package.
[[tool.mypy.overrides]]
module = ["reachy_mini_ha_satellite.daemon_app"]
disallow_subclassing_any = false

# --- Vendored third-party code ----------------------------------------------
# The one recorded exception to strict mode. These modules are derived from the
# Home Assistant project's Linux voice assistant (see the NOTICE beside them);
# they were written against a partially-annotated codebase and against protobuf
# stubs that mypy cannot follow, so strict mode has nothing useful to say about
# them and demanding it would mean rewriting upstream's signatures.
#
# They are relaxed here, by name, and NOT excluded: mypy still reads them, still
# checks what it can, and still catches a change that breaks a call. `seams.py`
# and `__init__.py` in the same directory are ours and stay strict, which is why
# the modules are listed rather than the package globbed.
[[tool.mypy.overrides]]
module = [
    "reachy_mini_ha_satellite.esphome.api_server",
    "reachy_mini_ha_satellite.esphome.entity",
    "reachy_mini_ha_satellite.esphome.models",
    "reachy_mini_ha_satellite.esphome.peripheral_api",
    "reachy_mini_ha_satellite.esphome.satellite",
    "reachy_mini_ha_satellite.esphome.util",
    "reachy_mini_ha_satellite.esphome.wake_word",
    "reachy_mini_ha_satellite.esphome.webrtc",
    "reachy_mini_ha_satellite.esphome.zeroconf",
]
# `strict` itself is a global-only switch, so the relaxation is spelled out:
# every flag `--strict` would turn on, turned back off for these modules alone.
disallow_any_generics = false
disallow_incomplete_defs = false
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_untyped_defs = false
extra_checks = false
no_implicit_reexport = false
strict_equality = false
warn_return_any = false
warn_unreachable = false
warn_unused_ignores = false
disable_error_code = ["redundant-expr", "truthy-bool"]
# Upstream's own mypy configuration silences these, and the reasons are the
# same here: `aioesphomeapi.api_pb2` is generated and has no stubs, and neither
# does `webrtc_noise_gain`.
ignore_missing_imports = true

# The tests carried from the same upstream, for the same reason: they are
# unannotated, so strict mode would reject every one of them.
[[tool.mypy.overrides]]
module = [
    "esphome_test_support",
    "test_satellite_esphome_api_server",
    "test_satellite_esphome_entity",
    "test_satellite_esphome_models",
    "test_satellite_esphome_protocol",
    "test_satellite_esphome_util",
    "test_satellite_esphome_wake_word",
    "test_satellite_esphome_webrtc",
    "test_satellite_esphome_zeroconf",
]
# Upstream's tests are unannotated, so mypy skips their bodies rather than
# type-checking code written without types in mind.
check_untyped_defs = false
disallow_any_generics = false
disallow_incomplete_defs = false
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_untyped_defs = false
extra_checks = false
no_implicit_reexport = false
strict_equality = false
warn_return_any = false
warn_unreachable = false
warn_unused_ignores = false
disable_error_code = ["redundant-expr", "truthy-bool"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
# Strict async mode: an async test without an explicit marker errors rather than
# being collected and silently never awaited.
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    # No test opens a socket unless it says so. This is the enforceable part of
    # the no-input-or-output rule: a unit test that reaches for the network
    # errors instead of quietly depending on a machine having one. An
    # integration test that exercises a real transport in-process opts in with
    # `@pytest.mark.enable_socket`, which makes that dependency visible in the
    # test rather than in a CI failure. The filesystem and sleeping halves of
    # the rule have no equivalent guard and stay review-enforced.
    #
    # `--allow-unix-socket` is required, not a loosening: asyncio builds its
    # event loop's self-pipe from an AF_UNIX socket pair, so banning those bans
    # every async test. It permits no network.
    "--disable-socket",
    "--allow-unix-socket",
    "--cov",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
testpaths = [
    "packages",
    "apps",
    "services",
    "cli",
    "bench",
    "tools",
    "scripts",
    "provisioning",
]
# A member's `tests/` is deliberately not a package, so a test module reaches
# its siblings' shared fakes by plain module name, and the directory holding
# them has to be on `sys.path`. The satellite and the groundstation do that from
# a `conftest.py` of their own. The members below do it here instead, and the
# reason is mypy rather than pytest: `explicit_package_bases` derives a module
# name by walking down from a path root and stops at the first directory whose
# name is not a valid identifier, so a `conftest.py` under a hyphenated member
# directory is the module `conftest` outright — and `apps/ha-satellite` already
# spends that name. Declaring both here keeps the two new members alike rather
# than splitting them over a constraint that happens to bind only one.
pythonpath = [
    "packages/reachy-checks/tests/support",
    "packages/reachy-session-client/tests/support",
    "cli/reachyctl/tests/support",
    "bench/tests/support",
    # The Ansible filter plugins. Ansible loads them by file name into a
    # namespace of its own, so there is no package to import them from; this is
    # what lets their tests import them under the same module names Ansible
    # gives them, and what makes the contract test able to render this side of
    # the managed region beside `reachyctl.managed`'s.
    "provisioning/ansible/plugins/filter",
]
filterwarnings = ["error"]
# The filesystem half of the no-input-or-output rule has no `--disable-socket`
# equivalent. This marker grants a unit test nothing: it declares that the test
# is not one, the way `enable_socket` does for an integration test. The golden
# fixture corpus is the case it exists for — the bytes on disk are the contract,
# so reading them is the behaviour under test and a fake would pin whatever the
# fake was told to return.
markers = [
    "filesystem: declares a contract test that reads committed data files; never a unit test.",
]

[tool.coverage.run]
branch = true
# Only member source is measured. Test files are not production code, and
# counting them inflates the number the diff gate reads.
source = [
    "packages/reachy-checks/src",
    "packages/reachy-contracts/src",
    "packages/reachy-session-client/src",
    "apps/ha-satellite/src",
    "services/groundstation/src",
    "cli/reachyctl/src",
    "bench/src",
    "tools/repo-hygiene/src",
    # The provisioning roles' Python. Not a member, and measured all the same:
    # it decides the bytes of a file on the robot and whether a run reports
    # success, which is exactly the code a diff-scoped gate should be watching.
    "provisioning/ansible/plugins/filter",
]
# Relative paths so the XML report is readable from any checkout root, which is
# what diff-cover needs to line results up against a diff.
relative_files = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    # The module-as-script guard. Its body is one line handing a return value to
    # the interpreter, and covering it would mean running the module as a
    # subprocess from a unit test, which is input and output for nothing.
    "if __name__ == .__main__.:",
]

[tool.coverage.xml]
output = "coverage.xml"
